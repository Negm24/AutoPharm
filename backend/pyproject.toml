[project]
name = "autopharm-backend"
version = "0.1.0"
description = "The authoritative Django API for the AutoPharm kiosk and AutoDoc applications."
requires-python = ">=3.14,<3.15"
dependencies = [
    "django[argon2]>=5.2.8,<5.3",
    "djangorestframework>=3.18,<3.19",
    "django-environ>=0.12,<0.13",
    "phonenumbers>=9,<10",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = [
    "test_*.py",
    "*_test.py",
]
testpaths = ["tests", "apps"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]